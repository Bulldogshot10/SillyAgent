name: SillyAgent CI

on:
  push:
    branches:
      - release
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sillyagent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Lint harness and integration files
        run: >-
          npx eslint
          src/agent/tool-registry.js
          src/agent/memory-store.js
          src/agent/builtin-tools.js
          src/endpoints/agent-tools.js
          src/middleware/agent-tools-body-limit.js
          src/server-startup.js
          public/scripts/tool-calling.js
          public/scripts/extensions/sillyagent-memory/index.js
          public/scripts/extensions/sillyagent-memory/memory-context.js

      - name: Lint test files
        run: npx eslint agent-tool-registry.test.js agent-tools-endpoint.test.js agent-memory-store.test.js agent-dreaming.test.js agent-memory-prompt.test.js agent-tools-body-limit.test.js
        working-directory: tests

      - name: Run unit tests
        run: npm run test:unit --prefix tests -- --runInBand
